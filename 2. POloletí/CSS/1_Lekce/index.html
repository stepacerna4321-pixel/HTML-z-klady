<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    a {
        text-decoration: none;
        display: block;
        color: black;
        text-align: center;
        transition: transform 0.25s ease, color 0.25 ease;
    }
    a:hover {
        text-decoration: underline;
        font-weight: bold;
        transform: scale(1.20);
        color: blue;
    }
    div {
        background-color: rgb(23138, 222, 168);
        width: 50%;
        margin: 0 auto;
        border-radius: 25px;
        transition: transform 0.25 ease;
    }
    div:hover {
        transform: scale(1.20);
    }
    h2 {
        text-align: center;
    }
</style>
<body>
 <section>
    <h2>CSS portfolio prací</h2>

    </div>
 </section>

</html>
